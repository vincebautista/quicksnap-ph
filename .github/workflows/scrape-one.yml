name: Scrape Top Article

on:
  schedule:
    # Runs every hour — adjust to taste (cron is UTC)
    - cron: "0 * * * *"
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Call scrape-one endpoint
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/scrape-one" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat response.json

          # Fail the job if HTTP status is not 2xx
          if [[ "$RESPONSE" -lt 200 || "$RESPONSE" -ge 300 ]]; then
            echo "❌ Request failed with status $RESPONSE"
            exit 1
          fi

          echo "✅ Done"